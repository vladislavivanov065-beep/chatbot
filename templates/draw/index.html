<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дуэль художников</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='draw/css/style.css') }}">
</head>
<body>
  <a href="{{ url_for('lobby') }}" class="back-link">← В лобби</a>

  <div class="app">

    <section id="screen-waiting" class="screen active">
      <div class="card">
        <div class="spinner"></div>
        <p>Ищем соперника…</p>
      </div>
    </section>

    <section id="screen-game" class="screen">
      <div class="game-topbar">
        <div class="player-tag" id="left-tag">Вы</div>
        <div class="round-info">
          <span id="round-label">Раунд 1 / 3</span>
          <span id="timer" class="timer">75</span>
        </div>
        <div class="player-tag" id="right-tag">Соперник</div>
      </div>

      <div class="game-board">
        <div class="canvas-wrap" id="left-wrap">
          <canvas id="left-canvas" width="300" height="300"></canvas>
        </div>

        <div class="reference-wrap">
          <p class="reference-label">Нарисуйте это:</p>
          <img id="reference-img" src="" alt="Образец">
        </div>

        <div class="canvas-wrap" id="right-wrap">
          <canvas id="right-canvas" width="300" height="300"></canvas>
          <div class="opponent-badge hidden" id="opponent-badge"></div>
        </div>
      </div>

      <div class="toolbar">
        <div class="colors">
          <button class="color-swatch active" data-color="#141414" style="background:#141414"></button>
          <button class="color-swatch" data-color="#e63946" style="background:#e63946"></button>
          <button class="color-swatch" data-color="#f48c06" style="background:#f48c06"></button>
          <button class="color-swatch" data-color="#ffd166" style="background:#ffd166"></button>
          <button class="color-swatch" data-color="#40916c" style="background:#40916c"></button>
          <button class="color-swatch" data-color="#457b9d" style="background:#457b9d"></button>
          <button class="color-swatch" data-color="#a8dadc" style="background:#a8dadc"></button>
          <button class="color-swatch" data-color="#ff8fab" style="background:#ff8fab"></button>
          <button class="color-swatch" data-color="#795548" style="background:#795548"></button>
        </div>
        <input id="brush-size" type="range" min="2" max="20" value="6">
        <button id="eraser-btn" class="btn btn-ghost">Ластик</button>
        <button id="undo-btn" class="btn btn-ghost btn-icon" title="Отменить последнее изменение" disabled>↶</button>
        <button id="redo-btn" class="btn btn-ghost btn-icon" title="Вернуть отменённое" disabled>↷</button>
        <button id="clear-btn" class="btn btn-ghost">Очистить</button>
        <button id="submit-btn" class="btn btn-primary">Готово</button>
      </div>
    </section>

    <section id="screen-result" class="screen">
      <div class="card result-card">
        <h2 id="result-title">Раунд завершён</h2>
        <div class="result-board">
          <div class="result-col">
            <p class="result-name">Вы</p>
            <img id="result-your-img" src="" alt="Ваш рисунок">
            <p class="result-score" id="result-your-score">0%</p>
          </div>
          <div class="result-col">
            <p class="result-name">Образец</p>
            <img id="result-reference-img" src="" alt="Образец">
          </div>
          <div class="result-col">
            <p class="result-name" id="result-opponent-name">Соперник</p>
            <img id="result-opponent-img" src="" alt="Рисунок соперника">
            <p class="result-score" id="result-opponent-score">0%</p>
          </div>
        </div>
        <p id="result-winner" class="result-winner"></p>
        <p id="total-scores" class="total-scores"></p>
        <button id="next-btn" class="btn btn-primary">Дальше</button>
        <button id="rematch-btn" class="btn btn-ghost hidden">Играть ещё раз</button>
        <p id="rematch-status" class="rematch-status"></p>
      </div>
    </section>

  </div>

  <script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
  <script src="{{ url_for('static', filename='draw/js/main.js') }}"></script>
</body>
</html>
