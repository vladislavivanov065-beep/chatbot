<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дуэль художников — лобби</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body>
  <div class="card lobby-card">
    <div class="lobby-topbar">
      <h1 style="margin:0;">🎨 Дуэль художников</h1>
      <a href="{{ url_for('lobby') }}" class="back-link">← В лобби</a>
    </div>
    <p class="subtitle">Двое рисуют один образец наперегонки</p>

    {% if my_room %}
      <p><a href="{{ url_for('draw.room', room_id=my_room) }}" class="btn btn-primary" style="display:inline-block;text-decoration:none;">Вернуться в свою игру</a></p>
    {% endif %}

    {% if lobbies %}
      <table class="lobby-table">
        <thead>
          <tr>
            <th>Создатель</th>
            <th>Статус</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {% for l in lobbies %}
          <tr>
            <td>{{ l.creator }}</td>
            <td><span class="lobby-status waiting">ждёт соперника</span></td>
            <td>
              <form method="POST" action="{{ url_for('draw.join', room_id=l.room_id) }}" style="margin:0;">
                <button type="submit" class="btn btn-primary btn-small">Присоединиться</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="lobby-empty">Открытых лобби пока нет — создайте своё!</p>
    {% endif %}

    <div class="lobby-create-form">
      <form method="POST" action="{{ url_for('draw.create') }}">
        <button type="submit" class="btn">Создать лобби</button>
      </form>
    </div>
  </div>
</body>
</html>
