<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Уно</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='uno/style.css') }}">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1>🎴 Уно</h1>
      <a href="{{ url_for('uno.index') }}">← К лобби уно</a>
    </header>

    <main id="layout">
      <div class="card-panel" id="waiting-card">
        <div class="status-line" id="waiting-status"></div>
        <div class="players-list" id="waiting-players"></div>
        <div class="action-bar">
          <button id="join-btn" class="btn">Присоединиться</button>
          <button id="start-btn" class="btn btn-ghost" hidden>Начать игру</button>
        </div>
      </div>

      <div class="card-panel" id="finished-card" hidden>
        <div class="finished-banner" id="finished-banner"></div>
        <div id="finished-log"></div>
      </div>

      <div id="game-layout" hidden>
        <div class="card-panel" id="table-panel">
          <div class="status-line" id="table-status"></div>
          <div id="opponents-list"></div>
          <div id="table-area">
            <div id="draw-pile" class="uno-pile" title="Взять карту">
              <div class="uno-card-back"></div>
              <span id="draw-pile-count" class="pile-count"></span>
            </div>
            <div id="discard-pile" class="uno-pile"></div>
          </div>
        </div>

        <div class="card-panel" id="hand-panel">
          <h3 style="margin-top:0;">Ваша рука</h3>
          <div id="hand-cards"></div>
          <div class="action-bar">
            <button id="draw-btn" class="btn btn-small">Взять карту</button>
            <button id="pass-btn" class="btn btn-ghost btn-small" hidden>Пропустить ход</button>
            <button id="uno-btn" class="btn btn-small" hidden>Кричать UNO! 🗣️</button>
          </div>
          <p class="hint-text" id="hand-hint"></p>
        </div>

        <div class="card-panel" id="log-panel">
          <h3 style="margin-top:0;">Журнал</h3>
          <div id="event-log"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="color-picker-overlay" hidden>
    <div id="color-picker-modal">
      <h3>Выберите цвет</h3>
      <div id="color-options">
        <button data-color="red" class="color-btn red"></button>
        <button data-color="yellow" class="color-btn yellow"></button>
        <button data-color="green" class="color-btn green"></button>
        <button data-color="blue" class="color-btn blue"></button>
      </div>
      <button id="color-cancel-btn" class="btn btn-ghost btn-small">Отмена</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
  <script>
    window.PLAYER_TOKEN = {{ token|tojson }};
    window.LOBBY_ID = {{ lobby_id|tojson }};
    window.IS_CREATOR = {{ is_creator|tojson }};
  </script>
  <script src="{{ url_for('static', filename='uno/main.js') }}"></script>
</body>
</html>
