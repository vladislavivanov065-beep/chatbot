<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дурак</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='durak/style.css') }}">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1>🃏 Дурак</h1>
      <a href="{{ url_for('durak.index') }}">← К лобби дурака</a>
    </header>

    <main id="layout">
      <div class="card-panel" id="waiting-card">
        <div class="status-line" id="waiting-status"></div>
        <div class="players-list" id="waiting-players"></div>
        <div class="action-bar">
          <button id="join-btn" class="btn">Войти в игру</button>
          <button id="start-btn" class="btn btn-ghost" hidden>Начать игру</button>
        </div>
      </div>

      <div class="card-panel" id="finished-card" hidden>
        <div class="finished-banner" id="finished-banner"></div>
      </div>

      <div class="card-panel" id="game-card" hidden>
        <div class="status-line" id="status-line"></div>

        <div id="table-area"></div>

        <div class="action-bar" id="action-bar"></div>
        <p class="hint-text" id="hint-text"></p>

        <div id="hand-area"></div>
      </div>

      <div class="card-panel">
        <h3 style="margin-top:0;">Игроки</h3>
        <div class="players-panel" id="players-panel"></div>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
  <script>
    window.PLAYER_TOKEN = {{ token|tojson }};
    window.LOBBY_ID = {{ lobby_id|tojson }};
    window.IS_CREATOR = {{ is_creator|tojson }};
  </script>
  <script src="{{ url_for('static', filename='durak/main.js') }}"></script>
</body>
</html>
