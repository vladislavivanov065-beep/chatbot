<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Покер</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='poker/style.css') }}">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1>♠️ Покер</h1>
      <a href="{{ url_for('poker.index') }}">← К лобби покера</a>
    </header>

    <main id="layout">
      <div class="card-panel" id="waiting-card">
        <div class="status-line" id="waiting-status"></div>
        <div class="players-list" id="waiting-players"></div>
        <div class="action-bar">
          <button id="join-btn" class="btn">Присоединиться (1000 фишек)</button>
          <button id="start-btn" class="btn btn-ghost" hidden>Начать игру</button>
        </div>
      </div>

      <div class="card-panel" id="finished-card" hidden>
        <div class="finished-banner" id="finished-banner"></div>
        <div id="finished-log"></div>
      </div>

      <div id="game-layout" hidden>
        <div class="card-panel" id="table-panel">
          <div class="status-line" id="table-status"></div>
          <div id="community-cards"></div>
          <div id="seats-list"></div>
        </div>

        <div class="card-panel" id="hand-panel">
          <h3 style="margin-top:0;">Ваши карты</h3>
          <div id="my-hole-cards"></div>
          <div class="action-bar">
            <button id="fold-btn" class="btn btn-ghost btn-small">Сбросить</button>
            <button id="check-btn" class="btn btn-small">Чек</button>
            <button id="call-btn" class="btn btn-small">Уравнять</button>
            <button id="allin-btn" class="btn btn-ghost btn-small">Ва-банк</button>
          </div>
          <div class="action-bar" id="raise-bar">
            <input type="range" id="raise-slider" min="0" max="1000" step="10">
            <input type="number" id="raise-amount" min="0" step="10">
            <button id="raise-btn" class="btn btn-small">Поднять</button>
          </div>
          <p class="hint-text" id="hand-hint"></p>
        </div>

        <div class="card-panel" id="log-panel">
          <h3 style="margin-top:0;">Журнал</h3>
          <div id="event-log"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
  <script>
    window.PLAYER_TOKEN = {{ token|tojson }};
    window.LOBBY_ID = {{ lobby_id|tojson }};
    window.IS_CREATOR = {{ is_creator|tojson }};
  </script>
  <script src="{{ url_for('static', filename='poker/main.js') }}"></script>
</body>
</html>
